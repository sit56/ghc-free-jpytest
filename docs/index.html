<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GitHub Actionsで記録したドル円の推移">
    <title>ドル円レート | Daily USD/JPY</title>
    <link rel="stylesheet" href="style.css">
    <script src="chart.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">DAILY REFERENCE RATE</p>
          <h1>ドル円レート</h1>
          <p class="subtitle">USD / JPY の日次推移</p>
        </div>
        <div class="latest" aria-live="polite">
          <span class="latest-label">最新レート</span>
          <strong id="latest-rate">--</strong>
          <span id="latest-date" class="latest-date">読み込み中</span>
        </div>
      </header>
      <section class="chart-card" aria-labelledby="chart-title">
        <div class="chart-heading">
          <h2 id="chart-title">レートの推移</h2>
          <span id="record-count" class="record-count"></span>
        </div>
        <div class="chart-wrap">
          <canvas id="rate-chart" role="img" aria-label="ドル円の日次レートチャート">
            お使いのブラウザーはチャート表示に対応していません。
          </canvas>
        </div>
        <p id="chart-status" class="status" role="status">データを読み込んでいます…</p>
      </section>
      <footer>
        <p>出典: <a href="https://www.frankfurter.dev/">Frankfurter API</a> ·
          参照レートであり、リアルタイムの取引価格ではありません。</p>
        <p>GitHub Actions により毎日更新</p>
      </footer>
    </main>
  </body>
</html>
